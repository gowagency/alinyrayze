<!--
  Aliny Rayze · /links · embed pronto para WordPress (Elementor HTML widget)
  CSS escopado em .aliny-links — não conflita com o tema.
  Lembrete: usar "Elementor Canvas" como Layout da Página antes de colar.
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@200;300;400;500;700&display=swap" rel="stylesheet">

<style>
  /* ===== Aliny Rayze · /links · estilos escopados ===== */
  .aliny-links *{box-sizing:border-box;margin:0;padding:0}
  .aliny-links{
    --sage:#A1AF9E;
    --sage-dark:#4E6E47;
    --sage-light:#CCDBC8;
    --cream:#F7F6F2;
    --beige:#E8DCC9;
    --taupe:#8C7464;
    --gold:#D7BB98;
    --shadow: 0 1px 2px rgba(78,110,71,.04), 0 8px 24px rgba(78,110,71,.06);
    --radius-pill: 100px;

    font-family:'Raleway', system-ui, -apple-system, sans-serif;
    font-size:16px; line-height:1.55;
    color:var(--taupe);
    /* fundo: imagem vertical da marca + overlay cremoso para legibilidade */
    background-color: var(--cream);
    background-image:
      linear-gradient(rgba(247,246,242,0.78), rgba(247,246,242,0.85)),
      url('https://alinyrayze.com.br/wp-content/uploads/2026/04/section5-alinyrayze.webp');
    background-size: cover;
    background-position: center top;
    background-repeat: no-repeat;
    background-attachment: fixed;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;

    min-height:100dvh;
    display:flex; justify-content:center;
    padding:48px 20px 64px;
    width:100%;
  }

  /* anula heranças do tema dentro da página */
  .aliny-links a{ text-decoration:none; color:inherit }
  .aliny-links img{ max-width:100%; height:auto; display:block }
  .aliny-links h1,.aliny-links p{ font-family:inherit }

  .aliny-links .page{
    width:100%; max-width:440px;
    display:flex; flex-direction:column;
    align-items:center; text-align:center;
  }

  /* Avatar estilo perfil do Instagram (anel + gap) */
  .aliny-links .avatar{
    width:132px; height:132px;
    border-radius:50%;
    padding:3px;
    background:
      conic-gradient(
        from 200deg,
        var(--sage) 0deg,
        var(--beige) 90deg,
        var(--gold) 180deg,
        var(--sage-light) 270deg,
        var(--sage) 360deg
      );
    box-shadow: var(--shadow);
    margin-bottom:20px;
    position:relative;
  }
  .aliny-links .avatar::before{
    content:""; position:absolute; inset:3px;
    border-radius:50%; background:var(--cream);
  }
  .aliny-links .avatar img{
    position:relative;
    width:100%; height:100%;
    border-radius:50%;
    object-fit:cover;
    border:3px solid var(--cream);
    background:var(--sage-light);
  }

  /* Identidade */
  .aliny-links .name{
    font-weight:300;
    font-size:30px;
    line-height:1.2;
    color:var(--taupe);
    letter-spacing:1px;
  }
  .aliny-links .role{
    margin-top:10px;
    font-size:11px;
    font-weight:400;
    letter-spacing:3.5px;
    text-transform:uppercase;
    color:var(--sage);
  }
  .aliny-links .tagline{
    margin-top:18px;
    font-weight:300;
    font-size:14px;
    line-height:1.55;
    color:var(--taupe);
    max-width:320px;
    opacity:.9;
  }

  /* Lista */
  .aliny-links .links{
    margin-top:34px;
    width:100%;
    display:flex; flex-direction:column;
    gap:12px;
  }

  .aliny-links .link{
    display:flex; align-items:center;
    gap:14px;
    width:100%;
    padding:15px 22px;
    background:#fff;
    border:1px solid rgba(161,175,158,.30);
    border-radius:var(--radius-pill);
    color:var(--taupe);
    font-size:14px;
    font-weight:400;
    letter-spacing:.3px;
    transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease, background .25s ease;
    position:relative;
  }
  .aliny-links .link:hover{
    transform: translateY(-2px);
    border-color: var(--sage);
    box-shadow: 0 6px 18px rgba(78,110,71,.10);
  }
  .aliny-links .link .ico{
    flex:0 0 20px; width:20px; height:20px;
    display:inline-flex; align-items:center; justify-content:center;
    color:var(--sage);
  }
  .aliny-links .link .label{ flex:1; text-align:left }
  .aliny-links .link .chev{
    flex:0 0 14px;
    color:var(--sage);
    opacity:.55;
    transition: transform .25s ease, opacity .25s ease;
  }
  .aliny-links .link:hover .chev{ transform: translateX(4px); opacity:1 }

  /* CTA primário com respiração */
  .aliny-links .link.primary{
    background: var(--sage);
    border-color: var(--sage);
    color:#fff;
    font-weight:500;
    animation: alinybreathe 3.5s ease-in-out infinite;
  }
  .aliny-links .link.primary .ico,
  .aliny-links .link.primary .chev{ color:#fff; opacity:.95 }
  .aliny-links .link.primary:hover{
    animation:none;
    background: var(--sage-dark);
    border-color: var(--sage-dark);
    transform: translateY(-2px) scale(1.015);
    box-shadow: 0 8px 24px rgba(78,110,71,.20);
  }
  @keyframes alinybreathe{
    0%,100%{ transform: scale(1); box-shadow: 0 0 0 0 rgba(161,175,158,.35) }
    50%   { transform: scale(1.015); box-shadow: 0 0 0 10px rgba(161,175,158,0) }
  }

  /* Tag "em breve" */
  .aliny-links .tag{
    display:inline-block;
    padding:3px 9px;
    border-radius:100px;
    background:var(--beige);
    color:var(--taupe);
    font-size:9px;
    font-weight:500;
    letter-spacing:1.8px;
    text-transform:uppercase;
    margin-left:6px;
    vertical-align:middle;
    line-height:1;
  }
  .aliny-links .link.coming{ cursor: default; opacity:.85 }
  .aliny-links .link.coming:hover{
    transform:none;
    border-color: rgba(161,175,158,.30);
    box-shadow:none;
  }
  .aliny-links .link.coming:hover .chev{ transform:none; opacity:.55 }

  /* Divisor */
  .aliny-links .divider{
    margin:32px auto 0;
    width:48px; height:1px;
    background:var(--sage-light);
    position:relative;
  }
  .aliny-links .divider::before{
    content:""; position:absolute; left:50%; top:50%;
    width:6px; height:6px; border-radius:50%;
    background:var(--sage);
    transform: translate(-50%,-50%);
  }

  /* Footer */
  .aliny-links .footer{
    margin-top:24px;
    text-align:center;
    color:var(--sage);
    font-size:10px;
    font-weight:300;
    letter-spacing:2px;
    text-transform:uppercase;
  }
  .aliny-links .footer .quote{
    font-weight:300;
    font-size:13px;
    color:var(--taupe);
    text-transform:none;
    letter-spacing:.3px;
    margin-bottom:14px;
    display:block;
    font-style:italic;
    opacity:.85;
  }
  .aliny-links .footer .copy{ opacity:.7 }

  @media (prefers-reduced-motion: reduce){
    .aliny-links .link.primary{ animation:none }
    .aliny-links .link, .aliny-links .link .chev{ transition:none }
  }
  @media (max-width: 380px){
    .aliny-links{ padding:32px 16px 48px }
    .aliny-links .name{ font-size:26px }
    .aliny-links .avatar{ width:118px; height:118px }
    .aliny-links .link{ padding:14px 18px; font-size:13px }
  }

  /* Tira fundos do tema atrás da página */
  body.page-template-elementor_canvas,
  body.page-id-137{
    background-color:#F7F6F2 !important;
    background-image:
      linear-gradient(rgba(247,246,242,0.78), rgba(247,246,242,0.85)),
      url('https://alinyrayze.com.br/wp-content/uploads/2026/04/section5-alinyrayze.webp') !important;
    background-size: cover !important;
    background-position: center top !important;
    background-repeat: no-repeat !important;
    background-attachment: fixed !important;
  }
</style>
